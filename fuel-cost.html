<!DOCTYPE html>

<html lang="ko"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>주유비 절감액 비교 계산기</title><style>body{font:16px/1.6 system-ui,sans-serif;background:#f3f6f7;color:#183343;margin:0;padding:15px}main{max-width:760px;margin:auto;background:white;border:1px solid #ccd5da;border-radius:10px;padding:18px}h1{font-size:24px}h2{font-size:19px}table{width:100%;border-collapse:collapse;margin:14px 0;table-layout:fixed}td,th{border:1px solid #cbd5db;padding:10px;overflow-wrap:anywhere}th{background:#eaf1f4}input{width:100%;box-sizing:border-box;padding:9px;border:1px solid #aaa;font:inherit}button{font:inherit;padding:10px 20px;border:1px solid #23566b;border-radius:5px;background:#23566b;color:white;cursor:pointer}button[type=reset]{background:white;color:#23566b}small{display:block;color:#52616b}#message{color:#a33224}td.num{text-align:right;font-variant-numeric:tabular-nums}@media(max-width:450px){main{padding:10px}td,th{padding:6px;font-size:14px}}</style></head><body><main><h1>주유비 절감액 비교 계산기</h1><p>현재 가격과 할인율, 월평균 주유비를 입력한 후 계산하기를 누르세요.</p><form id="form"><table><thead><tr><th>입력 항목</th><th>입력값</th></tr></thead><tbody><tr><td><label for="a">일반 주유소 가격 (원/L)</label></td><td><input id="a" type="number" min="0.01" step="any" required=""></td></tr><tr><td><label for="b">온누리상품권 주유소 가격 (원/L)</label></td><td><input id="b" type="number" min="0.01" step="any" required=""></td></tr><tr><td><label for="d">상품권 충전 할인율 (%)</label></td><td><input id="d" type="number" min="0" max="99.99" step="any" required=""></td></tr><tr><td><label for="m">일반 주유소 기준 월평균 주유비 (원)</label></td><td><input id="m" type="number" min="1" step="any" required=""></td></tr></tbody></table><button type="submit">계산하기</button> <button type="reset">초기화</button></form><p id="message" role="status"></p><section id="result" hidden="" aria-live="polite"><h2>계산 결과</h2><p id="liters"></p><table><tbody><tr><th>비교 항목</th><th>일반 주유소</th><th>상품권 이용</th></tr><tr><td>실질 단가 (원/L)</td><td class="num" id="aout"></td><td class="num" id="bout"></td></tr><tr><td>월간 주유비</td><td class="num" id="mout"></td><td class="num" id="cout"></td></tr><tr><td>연간 주유비</td><td class="num" id="yout"></td><td class="num" id="cyout"></td></tr></tbody></table><table><tbody><tr><th>비용 차이</th><th>예상 금액</th></tr><tr><td id="mlabel"></td><td class="num" id="ms"></td></tr><tr><td id="ylabel"></td><td class="num" id="ys"></td></tr></tbody></table><p id="verdict"></p></section><small>동일 주유량 기준입니다. 연간 금액은 현재 조건이 12개월 유지된다는 가정입니다. 상품권 충전 한도, 추가 이동비 및 카드 할인은 반영하지 않습니다.</small></main><script>const $=id=>document.getElementById(id);const won=n=>Math.round(n).toLocaleString('ko-KR')+'원';const unit=n=>n.toLocaleString('ko-KR',{maximumFractionDigits:2});function calc(a,b,d,m){const l=m/a,e=b*(1-d/100),c=l*e;return {l,e,c,s:m-c}}$('form').addEventListener('submit',ev=>{ev.preventDefault();const [a,b,d,m]=['a','b','d','m'].map(id=>$(id).valueAsNumber);if(![a,b,d,m].every(Number.isFinite)||a<=0||b<=0||d<0||d>=100||m<=0){$('message').textContent='입력값을 확인하세요.';$('result').hidden=true;return}const {l,e,c,s}=calc(a,b,d,m);$('message').textContent='';$('liters').textContent='월평균 주유량: '+unit(l)+'L';$('aout').textContent=unit(a);$('bout').textContent=unit(e);$('mout').textContent=won(m);$('cout').textContent=won(c);$('yout').textContent=won(m*12);$('cyout').textContent=won(c*12);$('mlabel').textContent=s>=0?'월간 절감액':'월간 추가 부담액';$('ylabel').textContent=s>=0?'연간 절감액':'연간 추가 부담액';$('ms').textContent=won(Math.abs(s));$('ys').textContent=won(Math.abs(s)*12);$('verdict').textContent=Math.abs(s)<0.000001?'두 주유소의 부담액이 같습니다.':s>0?'상품권 이용 주유소가 유리합니다.':'일반 주유소가 유리합니다.';$('result').hidden=false});$('form').addEventListener('reset',()=>{$('result').hidden=true;$('message').textContent=''});$('form').addEventListener('input',()=>{$('result').hidden=true;$('message').textContent=''})</script>
</body></html>
