<!DOCTYPE html>

<html lang="ko"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>주유비 절감액 비교 계산기</title><style>body{font:16px/1.65 system-ui,sans-serif;color:#172d3b;background:#f5f7f8;margin:0}main{max-width:700px;margin:auto;padding:20px}section{background:white;border:1px solid #ccd6dc;border-radius:10px;padding:16px}label{display:block;margin:12px 0}input{display:block;width:100%;box-sizing:border-box;padding:10px;font:inherit}button{background:#23566b;color:white;border:0;padding:10px 20px;border-radius:6px;font:inherit}output{display:block;background:#edf4f6;padding:14px;white-space:pre-line;margin:16px 0}small{display:block}</style></head><body><main><section><h1>주유비 절감액 비교 계산기</h1><p>현재 가격과 할인율을 직접 입력하세요.</p><form id="f"><label>일반 주유소 리터당 가격 (원)<input id="a" type="number" min="1" step="any" required=""></label><label>온누리상품권 사용 주유소 리터당 가격 (원)<input id="b" type="number" min="1" step="any" required=""></label><label>상품권 충전 할인율 (%)<input id="d" type="number" min="0" max="99.99" step="any" required=""></label><label>일반 주유소 기준 월평균 주유비 (원)<input id="m" type="number" min="1" step="any" required=""></label><output id="o" aria-live="polite">모든 항목을 입력하세요.</output><button type="reset">초기화</button></form><small>동일 주유량 기준입니다. 연간 금액은 현재 조건이 12개월 유지된다는 가정입니다. 충전 한도, 추가 이동비 및 카드 할인은 반영하지 않습니다.</small></section></main><script>const f=document.getElementById('f'),o=document.getElementById('o');const won=n=>Math.round(n).toLocaleString('ko-KR')+'원';function calc(){if(!f.checkValidity()){o.textContent='모든 항목에 유효한 값을 입력하세요.';return}const [a,b,d,m]=['a','b','d','m'].map(k=>Number(document.getElementById(k).value));const l=m/a,e=b*(1-d/100),c=l*e,s=m-c;if(![l,e,c,s,c*12].every(Number.isFinite)){o.textContent='입력값을 확인하세요.';return}o.textContent=`월평균 주유량: ${l.toFixed(1)}L\n일반 주유소 단가: ${won(a)}/L\n상품권 적용 단가: ${won(e)}/L\n일반 주유소 월 / 연간: ${won(m)} / ${won(m*12)}\n상품권 이용 월 / 연간: ${won(c)} / ${won(c*12)}\n월간 예상 ${s<0?'추가 부담액':'절감액'}: ${won(Math.abs(s))}\n연간 예상 ${s<0?'추가 부담액':'절감액'}: ${won(Math.abs(s)*12)}\n${s>0?'상품권 이용이 유리합니다.':s<0?'일반 주유소가 유리합니다.':'비용이 동일합니다.'}`}f.addEventListener('input',calc);f.addEventListener('submit',e=>e.preventDefault());f.addEventListener('reset',()=>setTimeout(calc,0));</script>
</body></html>
