<!DOCTYPE html>
<!-- saved from url=(0087)file:///C:/Users/PC/OneDrive/%EB%B0%94%ED%83%95%20%ED%99%94%EB%A9%B4/aircon-choice.html -->
<html lang="ko"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>생활환경별 에어컨 선택 가이드 | 머니플러스365</title><style>body{font:16px/1.6 system-ui,sans-serif;color:#172d3b;background:#f5f7f8;margin:0}main{max-width:760px;margin:auto;padding:18px}section,fieldset{background:white;border:1px solid #ccd6dc;border-radius:10px;padding:16px;margin:12px 0;min-width:0}label{display:block;margin:9px 0}input[type=number],select{display:block;width:100%;box-sizing:border-box;padding:10px;font:inherit;border:1px solid #9aaab4;border-radius:5px}button{padding:10px 18px;font:inherit;background:#23566b;color:white;border:0;border-radius:6px}output{display:block;background:#edf4f6;padding:14px;font-weight:bold;white-space:pre-line}small{display:block;color:#465660}h1{font-size:25px}h2{font-size:21px} .group+.group{border-top:1px solid #ccd6dc;padding-top:12px;margin-top:12px}#result{margin-top:12px;white-space:normal;font-weight:normal;overflow-wrap:anywhere}.counts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}.count{min-width:0}.bar{height:8px;background:#d6e1e5;border-radius:6px;overflow:hidden}.bar span{display:block;height:100%}.result-group{border-top:1px solid #ccd6dc;margin-top:12px;padding-top:8px}#result ul{padding-left:20px;margin:6px 0}#result li{margin:6px 0}#result small{margin-top:10px}button{margin-top:6px}</style></head><body><main><section id="life-section"><h2>생활환경별 선택 가이드</h2><form id="life"><label>벽걸이형 설치 가능 여부<select id="wf"><option value="u">미확인</option><option value="y">가능</option><option value="n">불가능</option></select></label><label>창문형 설치 가능 여부<select id="cf"><option value="u">미확인</option><option value="y">가능</option><option value="n">불가능</option></select></label><fieldset><legend>해당 생활 조건 모두 선택</legend><div id="needs"><div class="group"><strong>주거 형태 및 거주 계획</strong><label><input type="checkbox" value="0"> 전세·월세 등 임대주택에 거주함</label><label><input type="checkbox" value="1"> 향후 이사 가능성이 높음</label><label><input type="checkbox" value="8"> 장기간 거주할 예정임</label></div><div class="group"><strong>설치 환경 및 공사 조건</strong><label><input type="checkbox" value="2"> 벽면 타공이나 배관 공사를 피하고 싶음</label><label><input type="checkbox" value="3"> 실외기 설치 가능 위치가 멀리 있음</label><label><input type="checkbox" value="9"> 실외기 설치 가능 위치가 가까움</label><label><input type="checkbox" value="5"> 실외기 설치 공간이 협소함</label><label><input type="checkbox" value="10"> 기존 에어컨 배관이나 타공 구멍을 활용할 수 있음</label><label><input type="checkbox" value="6"> 설치 공사 시간과 번거로움을 줄이고 싶음</label><label><input type="checkbox" value="4"> 여름철에만 설치하고 나머지 계절에는 철거하고 싶음</label></div><div class="group"><strong>냉방 및 생활 편의성</strong><label><input type="checkbox" value="7"> 작은방의 독립적인 냉방이 필요함</label><label><input type="checkbox" value="14"> 냉방해야 할 공간이 비교적 넓음</label><label><input type="checkbox" value="11"> 취침 중 소음에 민감함</label><label><input type="checkbox" value="12"> 창문을 자주 열어 환기함</label><label><input type="checkbox" value="13"> 채광과 창문 공간을 유지하고 싶음</label><label><input type="checkbox" value="15"> 커튼·블라인드·방충망을 기존대로 사용하고 싶음</label></div></div></fieldset><label>가장 중요한 조건<select id="priority"><option value="">특별한 우선 조건 없음</option></select></label><button type="submit">선택 결과 확인</button> <button type="reset">초기화</button><output id="result" aria-live="polite">조건을 선택하세요.</output></form><small>설치 가능 여부가 우선입니다. 실제 소음, 안전한 철거 및 창문 이용 가능 범위는 모델별로 확인하세요.</small></section></main><script>
const needs=[["c", "전세·월세 등 임대주택에 거주함", "건물 변경 및 원상복구 부담 감소 가능"], ["c", "향후 이사 가능성이 높음", "철거 및 이전 편의성"], ["c", "벽면 타공이나 배관 공사를 피하고 싶음", "별도 냉매 배관 공사 불필요"], ["c", "실외기 설치 가능 위치가 멀리 있음", "추가 배관비 부담 감소"], ["c", "여름철에만 설치하고 나머지 계절에는 철거하고 싶음", "계절별 철거 편의성"], ["c", "실외기 설치 공간이 협소함", "별도 실외기 공간 불필요"], ["c", "설치 공사 시간과 번거로움을 줄이고 싶음", "비교적 간단한 설치"], ["c", "작은방의 독립적인 냉방이 필요함", "소규모 공간 냉방에 활용 가능"], ["w", "장기간 거주할 예정임", "고정 설치에 적합"], ["w", "실외기 설치 가능 위치가 가까움", "추가 배관비 부담 감소"], ["w", "기존 에어컨 배관이나 타공 구멍을 활용할 수 있음", "추가 공사 부담 감소 가능"], ["w", "취침 중 소음에 민감함", "압축기가 실외기에 분리됨"], ["w", "창문을 자주 열어 환기함", "창문 이용 편의성"], ["w", "채광과 창문 공간을 유지하고 싶음", "창문 공간 확보"], ["w", "냉방해야 할 공간이 비교적 넓음", "다양한 냉방 용량 선택 가능"], ["w", "커튼·블라인드·방충망을 기존대로 사용하고 싶음", "창문 주변 시설 이용 편의성"]];
const $=id=>document.getElementById(id);
const chosen=()=>[...$('needs').querySelectorAll('input:checked')].map(x=>Number(x.value));
function refresh(){const p=$('priority').value; $('priority').replaceChildren(new Option('특별한 우선 조건 없음',''));chosen().forEach(i=>$('priority').add(new Option(needs[i][1],i)));if(chosen().map(String).includes(p))$('priority').value=p;}
function dirty(){$('result').textContent='조건을 선택한 뒤 결과를 확인하세요.';}
$('needs').onchange=e=>{const i=Number(e.target.value);if(e.target.checked&&(i===3||i===9))$('needs').querySelector('input[value="'+(i===3?9:3)+'"]').checked=false;refresh();dirty();};
$('life').oninput=dirty;
$('life').onsubmit=e=>{e.preventDefault();const w=$('wf').value,c=$('cf').value,s=chosen(),p=$('priority').value,ws=s.filter(i=>needs[i][0]==='w'),cs=s.filter(i=>needs[i][0]==='c');let r,advice,preferred='',reason='';
if(w==='n'&&c==='n'){r='두 제품 모두 설치 어려움';advice='다른 냉방 방법을 검토하세요.';}
else if(w==='u'||c==='u'){r='설치 가능 여부 확인 필요';advice='미확인 설치 조건을 확인한 후 다시 비교하세요.';}
else if(w==='n'||c==='n'){preferred=w==='n'?'c':'w';r=(preferred==='w'?'벽걸이형':'창문형')+' 추천';reason='다른 제품은 설치가 불가능합니다.';advice='생활 조건보다 설치 가능 여부를 우선 반영했습니다. 설치 가능한 제품의 실제 비용과 성능을 확인하세요.';}
else if(!s.length){r='생활 조건을 선택하세요';advice='해당하는 생활 조건을 선택한 후 다시 확인하세요.';}
else if(p!==''&&s.includes(Number(p))){preferred=needs[Number(p)][0];r=(preferred==='w'?'벽걸이형':'창문형')+' 우선 검토 권장';reason='가장 중요한 조건을 우선 반영했습니다.';}
else if(ws.length!==cs.length){preferred=ws.length>cs.length?'w':'c';r=(preferred==='w'?'벽걸이형':'창문형')+(Math.abs(ws.length-cs.length)>=3?' 추천':' 우선 검토 권장');reason='선택한 생활 조건의 개수를 반영한 결과입니다.';}
else{r='두 제품의 구매·설치비 비교 권장';advice='두 제품에 유리한 조건의 개수가 같습니다. 가장 중요한 조건을 선택하거나 구매·설치비를 비교하세요.';}
if(!advice)advice='현재 조건에서는 '+(preferred==='w'?'벽걸이형':'창문형')+'을 우선 검토하세요. 최종 구매 전 실제 구매·설치비, 냉방 용량과 제품별 소음 수준을 비교하세요.';
const out=$('result');out.replaceChildren();function add(parent,tag,txt,cls){const el=document.createElement(tag);if(txt)el.textContent=txt;if(cls)el.className=cls;parent.append(el);return el;}
add(out,'strong','생활환경 분석 결과');const counts=add(out,'div','','counts');for(const [name,arr,color] of [['벽걸이형',ws,'#2563a6'],['창문형',cs,'#21856b']]){const b=add(counts,'div','','count');add(b,'div',name+'에 유리한 조건');const n=add(b,'strong',arr.length+'개 / 8개');n.style.cssText='font-size:23px;color:'+color;const bar=add(b,'div','','bar');const fill=add(bar,'span');fill.style.cssText='width:'+arr.length/8*100+'%;background:'+color;}
const title=add(out,'strong',r,'result-group');title.style.cssText='display:block;font-size:1.2em';if(p!==''&&s.includes(Number(p)))add(out,'div','가장 중요한 조건: '+needs[Number(p)][1]);if(reason)add(out,'div',reason);
for(const [name,arr] of [['벽걸이형',ws],['창문형',cs]]){const group=add(out,'div','','result-group');add(group,'strong',name+'에 유리한 판단 근거');if(!arr.length)add(group,'div','선택된 조건 없음');else{const ul=add(group,'ul');for(const i of arr){const li=add(ul,'li',needs[i][1]);add(li,'small',needs[i][2]).style.marginTop='0';}}}
const end=add(out,'div','','result-group');add(end,'strong','최종 선택 안내');add(end,'div',advice);add(out,'small','선택 항목 개수와 3개 차이 기준은 참고용이며 객관적인 적합도나 성능 점수가 아닙니다. 임대주택은 설치 동의 및 원상복구 조건을 확인하세요.');};
$('life').onreset=()=>setTimeout(()=>{refresh();dirty();},0);refresh();
</script></body></html>
