<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>공사 우선순위 점수표 | 머니플러스365</title><style>body{font-family:'Malgun Gothic',Arial,sans-serif;background:#f5f8fc;color:#192d43;margin:0;padding:22px}main{max-width:780px;margin:auto;background:white;padding:26px;border-radius:15px;box-shadow:0 2px 15px #dde4ed}h1{color:#164d80;margin:0 0 10px}p{line-height:1.65}section{border:1px solid #cddbea;border-radius:12px;margin:18px 0;padding:15px}h2{font-size:19px;margin:0 0 12px;color:#145789}label{display:grid;grid-template-columns:130px 1fr;align-items:center;gap:12px;margin:11px 0}select{font-size:15px;padding:10px;border:1px solid #b8c9d9;border-radius:8px;background:white;width:100%}.sum{text-align:right;font-weight:bold;color:#11558b}.notice{background:#eef6fc;padding:13px;border-radius:8px;font-size:14px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:15px 0}button{background:#1768a6;border:0;border-radius:8px;padding:11px 18px;color:white;cursor:pointer;font-size:15px}button.secondary{background:#65778b}#rank{line-height:1.9}small{color:#546578}@media(max-width:520px){main{padding:14px}body{padding:8px}label{grid-template-columns:95px 1fr;font-size:14px}select{font-size:13px}}@media print{body{background:white;padding:0}main{box-shadow:none;padding:0}.actions{display:none}select{appearance:none;border:0;padding:0}.notice{border:1px solid #bbb}section{break-inside:avoid}}</style></head><body><main><h1>공사 우선순위 점수표</h1><p>각 시설의 <strong>기능 불량·생활 불편·노후 및 마감 손상</strong>을 0~3점으로 평가하세요. 합계가 높은 시설부터 공사 필요성을 검토할 수 있습니다.</p><div id="areas"></div><h2>평가 결과</h2><div id="rank"></div><div class="actions"><button onclick="window.print()">인쇄 또는 PDF로 저장</button><button class="secondary" onclick="resetAll()">점수 초기화</button></div><p class="notice">※ 이 점수표는 공사 우선순위를 정하기 위한 <strong>자체 참고 도구</strong>이며 공식 진단·시공 기준이 아닙니다. 누수, 전기 이상 등 안전 문제가 의심되면 점수와 관계없이 전문가 점검을 우선하세요. 합계가 높다고 반드시 교체해야 하는 것은 아닙니다.</p><small>머니플러스365 · 생활경제 실용 점검표</small></main><script>const names=['욕실','주방·싱크대','창호','베란다','베란다 샤시','방문·문틀','벽지·바닥재','신발장','기타'];const labels=['기능 불량','생활 불편','노후·마감 손상'];const choices=[['정상 작동','가벼운 불편','일부 기능 불량','주요 기능 불량'],['불편 없음','가끔 불편','자주 불편','일상생활에 큰 지장'],['양호','일부 노후','여러 곳 손상','전체적으로 심한 노후']];document.getElementById('areas').innerHTML=names.map((name,i)=>`<section><h2>${name}</h2>${labels.map((label,j)=>`<label>${label}<select id="v${i}_${j}" aria-label="${name} ${label}" onchange="update()">${choices[j].map((c,k)=>`<option value="${k}">${k}점 · ${c}</option>`).join('')}</select></label>`).join('')}<div class="sum" id="s${i}">합계 0 / 9점</div></section>`).join('');function update(){let arr=names.map((name,i)=>{let score=labels.reduce((s,_,j)=>s+Number(document.getElementById(`v${i}_${j}`).value),0);document.getElementById('s'+i).textContent=`합계 ${score} / 9점`;return{name,score}});arr.sort((a,b)=>b.score-a.score);document.getElementById('rank').innerHTML=arr.map(x=>`<div>${x.name}: <strong>${x.score}점</strong> — ${x.score>=7?'우선 공사 필요성 검토':x.score>=4?'공사 여부 비교 검토':'상태 유지·추후 점검 고려'}</div>`).join('')}function resetAll(){document.querySelectorAll('select').forEach(x=>x.value='0');update()}update();</script></body></html>
