<html lang="ko"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>에어컨 구매·설치비 비교 | 머니플러스365</title><style>body{font:16px/1.6 system-ui,sans-serif;color:#172d3b;background:#f5f7f8;margin:0}main{max-width:760px;margin:auto;padding:18px}section,fieldset{background:white;border:1px solid #ccd6dc;border-radius:10px;padding:16px;margin:12px 0;min-width:0}label{display:block;margin:9px 0}input[type=number],select{display:block;width:100%;box-sizing:border-box;padding:10px;font:inherit;border:1px solid #9aaab4;border-radius:5px}button{padding:10px 18px;font:inherit;background:#23566b;color:white;border:0;border-radius:6px}output{display:block;background:#edf4f6;padding:14px;font-weight:bold;white-space:pre-line}small{display:block;color:#465660}h1{font-size:25px}h2{font-size:21px}</style></head><body><main><section id="cost-section"><h2>1. 구매·설치비 비교</h2><p>모든 금액을 실제 견적에 따라 직접 입력하세요. 제품가격에 포함되거나 필요 없는 항목은 0원으로 입력하거나 비워 두세요. 미확인 비용은 확인 후 입력하세요.</p><form id="cost"><fieldset><legend>벽걸이형</legend><label>제품 구매가격 (원)<input id="w0" type="number" min="1" step="1" placeholder="구매가격 입력" required=""></label><label>기본 설치비 (원)<input id="w1" type="number" min="0" step="1" placeholder="0"></label><label>추가 배관비 (원)<input id="w2" type="number" min="0" step="1" placeholder="0"></label><label>추가 타공비 (원)<input id="w3" type="number" min="0" step="1" placeholder="0"></label><label>실외기 앵글 비용 (원)<input id="w4" type="number" min="0" step="1" placeholder="0"></label><label>배수펌프 등 기타 추가비 (원)<input id="w5" type="number" min="0" step="1" placeholder="0"></label><output id="wout">제품가격을 입력하세요.</output></fieldset><fieldset><legend>창문형</legend><label>제품 구매가격 (원)<input id="c0" type="number" min="1" step="1" placeholder="구매가격 입력" required=""></label><label>기본 설치비 (원)<input id="c1" type="number" min="0" step="1" placeholder="0"></label><label>연장키트 비용 (원)<input id="c2" type="number" min="0" step="1" placeholder="0"></label><label>기타 추가 설치비 (원)<input id="c3" type="number" min="0" step="1" placeholder="0"></label><output id="cout">제품가격을 입력하세요.</output></fieldset><output id="total" aria-live="polite">두 제품의 구매가격과 유효한 비용을 입력하세요.</output><button type="reset">초기화</button></form><small>전기요금과 향후 이전설치비 제외. 가격과 설치비는 판매처 및 설치 조건에 따라 달라집니다.</small></section></main><script>
const $=id=>document.getElementById(id), won=x=>x.toLocaleString('ko-KR')+'원';
function calc(){const sum=(k,n)=>Array.from({length:n},(_,i)=>Number($(k+i).value)||0).reduce((a,b)=>a+b,0);const w=sum('w',6),c=sum('c',4);for(const [k,v] of [['w',w],['c',c]]){$(k+'out').textContent=$(k+'0').checkValidity()&&$(k+'0').value?'입력 비용 합계 '+won(v):'제품가격을 입력하세요.'}if(!$('cost').checkValidity()){$('total').textContent='두 제품의 구매가격과 유효한 비용을 입력하세요.';return}$('total').textContent=w===c?'두 제품 비용 동일':(w<c?'벽걸이형':'창문형')+'이 '+won(Math.abs(w-c))+' 저렴합니다.'} $('cost').oninput=calc;$('cost').onreset=()=>setTimeout(calc,0);calc();
</script></body></html>
